[package]
name = "poki-launcher"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Gets the WebDriverAgent runner up on the phone it runs on, and keeps it up (PokiLauncher)."

[lib]
name = "poki_launcher"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { path = "../../.deps/idevice-launcher/idevice", default-features = false, features = ["aws-lc", "tcp", "core_device", "display_stream", "core_device_proxy", "rsd", "tunnel_tcp_stack", "dvt", "installation_proxy", "afc", "misagent", "remote_pairing", "cryptexd", "xctest", "device_info", "springboardservices"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.7"
# Poki Setup's core without its desktop-only parts: Apple sign-in, portal, re-signing, releases.
poki-setup-core = { path = "../../desktop/core", default-features = false }
base64 = "0.22"
futures-util = "0.3"
uuid = { version = "1.16", features = ["v4"] }
# Pinned as the process default before anything else makes TLS: idevice talks to the phone with aws-lc,
# and the signer's HTTP stack would otherwise install ring for the whole process.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
idevice = { path = "../../.deps/idevice-launcher/idevice", default-features = false, features = ["usbmuxd"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
